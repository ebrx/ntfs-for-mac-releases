<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xml:lang="en" role="img" aria-labelledby="disk-flow-title disk-flow-desc"><title id="disk-flow-title">How NTFS files are written in Finder</title><desc id="disk-flow-desc">Disk-writing architecture: the SwiftUI app, authenticated helper, NTFS-3G engine, macFUSE FSKit, and Finder.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#EDF9F9" /><stop offset="1" stop-color="#EAF0F9" /></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#078698" /></marker></defs><rect width="1600" height="900" rx="32" fill="url(#bg)" /><text x="80" y="100" font-size="46" fill="#183344" font-weight="700" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">How NTFS files are written in Finder</tspan></text><text x="80" y="150" font-size="24" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">Authorization and device checks come first; the engine and macOS integration handle the rest</tspan></text><rect x="80" y="240" width="400" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="104" y="284" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">Native SwiftUI app</tspan></text><text x="104" y="322" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">Disk detection · Automatic writing</tspan><tspan x="104" dy="24">Open in Finder</tspan></text><path d="M480,300 L580,300" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="600" y="240" width="420" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="624" y="284" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="624" dy="0">Authenticated helper</tspan></text><text x="624" y="322" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="624" dy="0">Caller signature · Device identity</tspan><tspan x="624" dy="24">Volume status checks</tspan></text><path d="M810,360 L810,420" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="600" y="440" width="420" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="624" y="484" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="624" dy="0">NTFS-3G engine</tspan></text><text x="624" y="522" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="624" dy="0">Authorized device file descriptor;</tspan><tspan x="624" dy="24">runs as a standard user</tspan></text><path d="M1020,500 L1100,500" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="1120" y="440" width="400" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="1144" y="484" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="1144" dy="0">macFUSE FSKit</tspan></text><text x="1144" y="522" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="1144" dy="0">Connects file operations to macOS</tspan></text><path d="M1320,560 L1320,620" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="1120" y="640" width="400" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="1144" y="684" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="1144" dy="0">Finder file operations</tspan></text><text x="1144" y="722" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="1144" dy="0">Copy · Create folders · Rename · Delete</tspan></text><rect x="80" y="640" width="720" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="104" y="684" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">Read-only mode and eject</tspan></text><text x="104" y="722" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">Apple NTFS for true read-only access;</tspan><tspan x="104" dy="24">unmount normally and confirm writing has stopped</tspan></text><text x="80" y="470" font-size="23" fill="#183344" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">Proven components beneath the app</tspan><tspan x="80" dy="28">The app manages and validates access</tspan></text><text x="80" y="550" font-size="20" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">No dirty-volume repair, forced writes</tspan><tspan x="80" dy="25">or formatting</tspan></text><text x="80" y="844" font-size="21" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">NTFS for Mac Community · Free community preview</tspan></text></svg>