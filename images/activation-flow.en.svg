<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xml:lang="en" role="img" aria-labelledby="activation-flow-title activation-flow-desc"><title id="activation-flow-title">How free activation works offline</title><desc id="activation-flow-desc">Offline activation: creator-signed codes verified locally with a public key in the app and helper.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#EDF9F9" /><stop offset="1" stop-color="#EAF0F9" /></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#078698" /></marker></defs><rect width="1600" height="900" rx="32" fill="url(#bg)" /><text x="80" y="100" font-size="46" fill="#183344" font-weight="700" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">How free activation works offline</tspan></text><text x="80" y="150" font-size="24" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">Signatures verify the issuer; non-expiring codes and system compatibility are separate</tspan></text><rect x="80" y="260" width="420" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="104" y="304" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">Creator issues codes locally</tspan></text><text x="104" y="342" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">Ed25519 private key;</tspan><tspan x="104" dy="24">held only by the creator</tspan></text><path d="M500,320 L600,320" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="620" y="260" width="400" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="644" y="304" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="644" dy="0">Free, non-expiring code</tspan></text><text x="644" y="342" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="644" dy="0">Offline signature · Random ID</tspan><tspan x="644" dy="24">No expiration date</tspan></text><path d="M1020,320 L1100,320" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="1120" y="260" width="400" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="1144" y="304" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="1144" dy="0">Paste code to activate</tspan></text><text x="1144" y="342" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="1144" dy="0">The installer includes only</tspan><tspan x="1144" dy="24">the public verification key</tspan></text><path d="M1320,380 L1320,460" fill="none" stroke="#078698" stroke-width="4" marker-end="url(#arrow)" /><rect x="1040" y="480" width="480" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="1064" y="524" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="1064" dy="0">App UI + helper verification</tspan></text><text x="1064" y="562" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="1064" dy="0">Invalid signatures block new</tspan><tspan x="1064" dy="24">physical-drive write mounts</tspan></text><rect x="80" y="620" width="760" height="120" rx="24" fill="white" stroke="#BBD7DE" stroke-width="2" /><text x="104" y="664" font-size="27" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">No device identifiers collected for activation</tspan></text><text x="104" y="702" font-size="19" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="104" dy="0">No account · No online activation · No expiration or remote revocation</tspan></text><text x="80" y="478" font-size="30" fill="#183344" font-weight="650" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">The private key is never distributed</tspan></text><text x="80" y="524" font-size="22" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">Valid codes can be shared; no claim of unbreakable protection</tspan></text><text x="1040" y="700" font-size="22" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="1040" dy="0">Normal eject, read-only mode and quit</tspan><tspan x="1040" dy="27">remain available without activation</tspan></text><text x="80" y="844" font-size="21" fill="#536C78" font-weight="500" font-family="Helvetica,Arial,sans-serif"><tspan x="80" dy="0">NTFS for Mac Community · Free community preview</tspan></text></svg>